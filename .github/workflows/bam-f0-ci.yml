name: BAM / F0 Foundation CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bam-f0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bam-f0:
    name: BAM F0 Format, Clippy, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure Rust components
        run: rustup component add rustfmt clippy
      - name: Rust formatting
        run: cargo fmt --manifest-path apps/bam/Cargo.toml --all -- --check
      - name: Rust lint
        run: cargo clippy --manifest-path apps/bam/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust unit and integration tests
        run: cargo test --manifest-path apps/bam/Cargo.toml --all-targets --all-features
