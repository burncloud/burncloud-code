[package]
name = "bam"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BurnCloud Agent Manager - controlled local orchestration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
