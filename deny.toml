# Cargo Deny policy adapted from burncloud/burncloud for this standalone crate.
# Do not import the parent workspace's advisory ignores or dependency-layer wrappers.
[graph]
targets = []
all-features = true

[output]
feature-depth = 1

[advisories]
# New and existing advisories must be reviewed; no blanket exceptions.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "CDLA-Permissive-2.0",
    "NCSA",
]

[licenses.private]
ignore = true

[bans]
# Match parent repo's baseline until transitive duplicate versions are reviewed.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
